<div class="custom-container container">
  <div class="tabs">
    <div class="tab" [ngClass]="{ active: tab == 'profile' }">
      <p class="cursor" (click)="tab = 'profile'">Profile</p>
    </div>
    <div class="tab" [ngClass]="{ active: tab == 'password' }">
      <p class="cursor" (click)="tab = 'password'">Password</p>
    </div>
    <div class="tab" [ngClass]="{ active: tab == 'payment' }">
      <p class="cursor" (click)="tab = 'payment'">Payment</p>
    </div>
  </div>

  <div class="setting">
    <div *ngIf="tab == 'profile'">
      <div class="d-flex gap-4 align-items-center">
        <div>
          <div class="avatar"></div>
        </div>
        <div>
          <button class="change">Change Avatar</button>
        </div>
        <div>
          <button class="delete">Delete</button>
        </div>
      </div>

      <div class="mt-5">
        <form class="row gy-4">
          <div class="form-group col-lg-12">
            <label>Full name </label>
            <div class="input-group">
              <input
                type="text"
                class="form-control quiz-input"
                value="Israel Adegbulugbe"
              />
            </div>
            <span class="message">E.g firstname before lastname</span>
          </div>
          <div class="form-group col-lg-12">
            <label>Email </label>
            <div class="input-group">
              <input
                type="text"
                class="form-control quiz-input"
                value="adegbulugbeisrael@gmail.com"
              />
            </div>
          </div>
          <div class="form-group col-lg-12">
            <label>Phone Number </label>
            <div class="input-group">
              <input
                type="text"
                class="form-control quiz-input"
                value="+1 231-231-2312"
              />
            </div>
          </div>
          <div class="form-group col-lg-12 position-relative">
            <label>Country </label>
            <div class="input-group">
              <select type="text" class="form-control quiz-input">
                <option
                  *ngFor="let country of countries"
                  [value]="country"
                  selected
                >
                  {{ country }}
                </option>
              </select>
            </div>
            <img
              src="../../../../assets/icons/expand_more.svg"
              class="expand_more"
              alt=""
            />
          </div>
          <div class="form-group col-lg-6">
            <label>State </label>
            <div class="input-group">
              <input
                type="text"
                class="form-control quiz-input"
                value="Texas"
              />
            </div>
          </div>
          <div class="form-group col-lg-6">
            <label>ZIP Code </label>
            <div class="input-group">
              <input
                type="text"
                class="form-control quiz-input"
                value="100889"
              />
            </div>
          </div>
          <div class="form-group col-lg-12">
            <label>Address</label>
            <div class="input-group">
              <textarea
                type="text"
                class="form-control quiz-input"
                style="height: 76px !important"
              >
Texas, Dallas</textarea
              >
            </div>
          </div>
          <div class="form-group col-lg-12">
            <label>Gender </label>
            <div class="row justify-content-between">
              <div class="col-lg-6 col-6">
                <div
                  class="custom-radio d-flex gap-2"
                  [ngClass]="{ unchecked: gender != 'male' }"
                  (click)="gender = 'male'"
                >
                  <div>
                    <img
                      src="../../../../assets/icons/RadioButtonChecked.svg"
                      alt=""
                      *ngIf="gender === 'male'"
                    />
                    <img
                      src="../../../../assets/icons/RadioUnchecked.svg"
                      alt=""
                      *ngIf="gender === 'female'"
                    />
                  </div>
                  <div><p>Male</p></div>
                </div>
              </div>
              <div class="col-lg-6 col-6">
                <div
                  class="custom-radio d-flex gap-2"
                  (click)="gender = 'female'"
                  [ngClass]="{ unchecked: gender != 'female' }"
                >
                  <div>
                    <img
                      src="../../../../assets/icons/RadioButtonChecked.svg"
                      alt=""
                      *ngIf="gender === 'female'"
                    />
                    <img
                      src="../../../../assets/icons/RadioUnchecked.svg"
                      alt=""
                      *ngIf="gender === 'male'"
                    />
                  </div>
                  <div><p>Female</p></div>
                </div>
              </div>
            </div>
          </div>

          <div>
            <button class="submit">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div *ngIf="tab == 'password'">
      <div class="mt-5">
        <form class="row gy-4">
          <div class="form-group col-lg-12">
            <label>Current Password </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control quiz-input"
                value="90mdownidon393"
              />
            </div>
          </div>
          <div class="form-group col-lg-12">
            <label>New Password </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control quiz-input"
                value="90mdownidon393"
              />
            </div>
          </div>
          <div class="form-group col-lg-12">
            <label>Confirm New Password </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control quiz-input"
                value="90mdownidon393"
              />
            </div>
          </div>

          <div>
            <button class="submit">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div *ngIf="tab == 'payment'">
      <div class="mt-5">
        <div class="payment-bx position-relative">
          <div class="d-flex gap-3">
            <div>
              <img src="../../../../assets/icons/paypal-logo.svg" alt="" />
            </div>
            <div>
              <div>
                <p class="title">Integrate with Paypal to receive payments</p>
              </div>
              <div class="d-flex justify-content-between">
                <div><p class="sub">Payment tax fee is $2</p></div>
                <div class="form-check form-switch">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="flexSwitchCheckDefault"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
