<div class="container">
    <div class="row">
        <div class="login-container bg-white shadow p-5">
            <div>
              <ul class="nav nav-pills nav-fill gap-5 p-1 small switch-container  shadow-sm" id="pillNav2"
                role="tablist"
                style="--bs-nav-link-color: var(--bs-white); --bs-nav-pills-link-active-color: var(--bs-primary); --bs-nav-pills-link-active-bg: var(--bs-white);">
                <li class="nav-item" role="presentation">
                  <button (click)="switchToTab('register')" class="nav-link active" [class.active]="activeTab === 'register'" id="home-tab2" data-bs-toggle="tab" type="button" role="tab"
                    aria-selected="true">Sign Up</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button (click)="switchToTab('login')" class="nav-link" [class.active]="activeTab === 'login'" id="profile-tab2" data-bs-toggle="tab" type="button" role="tab"
                    aria-selected="false">Log in</button>
                </li>
              </ul>
            </div>
            <div class="login-container bg-white shadow p-5 mt-4">
                <div class="row justify-content-center">
                    <div class="col-md-6"> <!-- Adjust the column width as needed -->
                        <div class="text-center"> <!-- Center the content horizontally -->
                            <!-- Your logo content here -->
                            logo
                        </div>
                    </div>
                </div>
                <div [ngSwitch]="currentTab" class="mt-4">
                    <!-- Login Form -->
                    <div *ngSwitchCase="'login'" class="tab-pane fade show active">
                      <form [formGroup]="signInForm" (ngSubmit)="onSignIn()">
                        
                        <div class="form-group">
                            <label>Email Address</label>
                            <div class="input-group">
                              <!-- <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                              </div> -->
                              <input type="text" style="font-size: 13px;" class="form-control" formControlName="email" placeholder="Email Address">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <div class="input-group">
                              <!-- <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                              </div> -->
                              <input type="text" style="font-size: 13px;" class="form-control" formControlName="email" placeholder="password">
                            </div>
                          </div>
                        <div class="row align-items-center remember">
                          <input type="checkbox">Remember Me
                        </div>
                        <div class="form-group">
                          <button type="submit" [disabled]="signInForm.invalid" value="Login" class="btn btn-active btn-lg">Login</button>
                        </div>
                      </form>
                    </div>
                    <!-- Register Form -->
                    <div *ngSwitchCase="'register'" class="tab-pane fade show">
                        <form [formGroup]="signUpForm" (ngSubmit)="onSignUp()">
                            <div class="form-group">
                              <label>Full Name</label>
                              <div class="input-group">
                                <!-- <div class="input-group-prepend">
                                  <span class="input-group-text"><i class="fas fa-user"></i></span>
                                </div> -->
                                <input type="text" style="font-size: 13px;" class="form-control" formControlName="fullname" placeholder="Full Name">
                              </div>
                            </div>
                          
                            <div class="form-group">
                              <label>Email Address</label>
                              <div class="input-group">
                                <!-- <div class="input-group-prepend">
                                  <span class="input-group-text"><i class="fas fa-user"></i></span>
                                </div> -->
                                <input type="text" style="font-size: 13px;" class="form-control" formControlName="email" placeholder="Email Address">
                              </div>
                            </div>

                            <div class="form-group">
                                <label>Desired Username</label>
                                <div class="input-group">
                                  <!-- <div class="input-group-prepend">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                  </div> -->
                                  <input type="text" style="font-size: 13px;" class="form-control" formControlName="email" placeholder="Email Address">
                                </div>
                              </div>
                          
                            <div class="form-group">
                              <label>Password</label>
                              <div class="input-group">
                                <!-- <div class="input-group-prepend">
                                  <span class="input-group-text"><i class="fas fa-key"></i></span>
                                </div> -->
                                <input type="password" style="font-size: 13px;" class="form-control" formControlName="password" placeholder="Password">
                              </div>
                            </div>
                          
                            <div class="form-group">
                              <label>Confirm Password</label>
                              <div class="input-group">
                                <!-- <div class="input-group-prepend">
                                  <span class="input-group-text"><i class="fas fa-key"></i></span>
                                </div> -->
                                <input type="password" style="font-size: 13px;" class="form-control" formControlName="confirm_password" placeholder="Confirm Password">
                              </div>
                            </div>
                          
                            <div class="form-group">
                              <input type="submit" value="Sign Up" [disabled]="signUpForm.invalid" class="btn btn-active btn-lg">
                            </div>
                        </form>
                      <div class="card-footer">
                        <div class="d-flex justify-content-center links">
                          have an account?<a (click)="switchToTab('login')">Login</a>
                        </div>
                      </div>
                    </div>
                    
                  </div>
            </div>
        </div>
        
    </div>
</div>
