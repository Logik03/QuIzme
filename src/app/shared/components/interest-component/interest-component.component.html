<div>
    <h2>Select Interests</h2>
    <div *ngFor="let interest of interests">
      <input type="checkbox" [id]="interest.id" [value]="interest.name" (change)="toggleSelection($event, interest)">
      <label [for]="interest.id">{{ interest.name }}</label>
    </div>
    <div *ngIf="selectedInterests.length > 0">
      <h3>Selected Interests:</h3>
      <ul>
        <li *ngFor="let selectedInterest of selectedInterests">{{ selectedInterest }}</li>
      </ul>
    </div>
  </div>
