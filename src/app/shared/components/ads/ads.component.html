<ng-template #content let-modal>
  <div class="modal-body">
    <video
      src="../../../../assets/ad.mp4"
      [playsInline]="true"
      autoplay
    ></video>

    <div class="skip">
      <span class="badge" (click)="canSkip && skipAd(modal)">
        {{ countdown > 15 ? countdown : "Skip ad" }}
      </span>
    </div>
  </div>
</ng-template>
